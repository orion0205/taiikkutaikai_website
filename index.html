<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻玉社高等学校 体育大会速報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }

    @keyframes pulse-ring {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    .animate-live {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }

    /* 学年別グラデーション設定 */
    .bg-grade-default {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
    }
    .bg-grade-4 {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
    }
    .bg-grade-5 {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
    }
    .bg-grade-6 {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-indigo-950 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🏃</span>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">攻玉社高等学校 体育大会</h1>
      </div>
      <!-- 手動更新ボタンと時刻表示 -->
      <div class="flex items-center space-x-3 text-xs sm:text-sm">
        <span id="last-updated-text" class="text-indigo-200">最終更新: --:--:--</span>
        <button id="refresh-btn" onclick="fetchData(true)" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-1.5 px-3 rounded-lg shadow transition duration-150 active:scale-95 disabled:opacity-50">
          <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span>今すぐ更新</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl mx-auto px-4 py-6 w-full flex-grow space-y-8">

    <!-- 現在行われている種目 -->
    <section>
      <div id="current-event-card" class="bg-grade-default rounded-2xl p-6 shadow-xl text-center transition-all duration-500 transform">
        <div class="inline-flex items-center space-x-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold tracking-wide uppercase mb-3">
          <span class="w-2 h-2 rounded-full bg-red-400 animate-ping"></span>
          <span>現在行われている種目</span>
        </div>
        <div id="current-event-display" class="text-3xl sm:text-4xl font-black tracking-wide my-1">
          読み込み中...
        </div>
      </div>
    </section>

    <!-- クラス対抗 得点順位 -->
    <section>
      <div class="flex items-center justify-between border-b-2 border-slate-200 pb-2 mb-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span>🏆</span> クラス対抗 得点順位
        </h2>
        <span class="text-xs text-slate-500">高い順</span>
      </div>
      <div id="ranking-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <div class="col-span-full text-center py-8 text-slate-400">データを読み込んでいます...</div>
      </div>
    </section>

    <!-- 競技プログラム -->
    <section>
      <div class="border-b-2 border-slate-200 pb-2 mb-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span>📋</span> 競技プログラム
        </h2>
      </div>
      <ul id="program-container" class="space-y-2">
        <li class="text-center py-8 text-slate-400">データを読み込んでいます...</li>
      </ul>
    </section>

  </main>

  <footer class="bg-slate-900 text-slate-400 text-center py-4 text-xs">
    &copy; 攻玉社高等学校 体育大会 運営
  </footer>

  <script>
    // ★ 設定方法：
    // GoogleスプレッドシートのURL例: https://docs.google.com/spreadsheets/d/1ABC123xyz.../edit#gid=0
    // の場合、1ABC123xyz... の文字列を SPREADSHEET_ID に入力してください。
    // （またはこれまで通りの pub?output=csv URL を CSV_URL に入れても動きます）
    
    const SPREADSHEET_ID = "1W-sIjS8sE719uHCgWl5ycFHCSzL18frQJ0QuBTmcHMg"; // ここにスプレッドシートIDを入力（推奨）
    const CSV_URL_BACKUP = ""; // ID入力が分からない場合は従来のCSV公開URLをここに入力

    function getFetchUrl() {
      if (SPREADSHEET_ID && SPREADSHEET_ID.trim() !== "") {
        return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID.trim()}/export?format=csv`;
      }
      return CSV_URL_BACKUP.trim();
    }

    // CSVパース（カンマや改行の処理）
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      return lines.map(line => {
        const result = [];
        let cell = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(cell.trim().replace(/^"|"$/g, ''));
            cell = '';
          } else {
            cell += char;
          }
        }
        result.push(cell.trim().replace(/^"|"$/g, ''));
        return result;
      });
    }

    // データ取得＆UI更新関数
    async function fetchData(isManual = false) {
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshIcon = document.getElementById('refresh-icon');

      if (isManual) {
        refreshBtn.disabled = true;
        refreshIcon.classList.add('animate-spin');
      }

      const targetUrl = getFetchUrl();

      if (!targetUrl) {
        document.getElementById('current-event-display').textContent = '設定未完了';
        document.getElementById('ranking-container').innerHTML = '<div class="col-span-full text-center py-8 text-amber-600 bg-amber-50 rounded-xl font-medium">SPREADSHEET_ID または CSV_URL を指定してください。</div>';
        document.getElementById('program-container').innerHTML = '<li class="text-center py-8 text-amber-600 bg-amber-50 rounded-xl font-medium">SPREADSHEET_ID または CSV_URL を指定してください。</li>';
        if (isManual) {
          setTimeout(() => {
            refreshBtn.disabled = false;
            refreshIcon.classList.remove('animate-spin');
          }, 300);
        }
        return;
      }

      try {
        // ★ キャッシュ破棄用のパラメータとfetchオプションを適用
        const cacheBuster = '_nc=' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        const urlWithParam = targetUrl.includes('?') ? `${targetUrl}&${cacheBuster}` : `${targetUrl}?${cacheBuster}`;

        const response = await fetch(urlWithParam, {
          cache: 'no-store',
          headers: {
            'Pragma': 'no-cache',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        });

        if (!response.ok) throw new Error('ネットワーク応答エラー');

        const dataText = await response.text();
        const rows = parseCSV(dataText);
        const dataRows = rows.slice(1);

        // 1. 現在行われている種目 (E2セル)
        const currentEvent = dataRows[0] && dataRows[0][4] ? dataRows[0][4] : '---';
        const eventCard = document.getElementById('current-event-card');
        document.getElementById('current-event-display').textContent = currentEvent;

        // 学年判定とカラー適用
        eventCard.className = 'rounded-2xl p-6 shadow-xl text-center transition-all duration-500 transform ';
        if (currentEvent.includes('4年')) {
          eventCard.classList.add('bg-grade-4');
        } else if (currentEvent.includes('5年')) {
          eventCard.classList.add('bg-grade-5');
        } else if (currentEvent.includes('6年')) {
          eventCard.classList.add('bg-grade-6');
        } else {
          eventCard.classList.add('bg-grade-default');
        }

        // 2. 得点順位 (A列, B列, C列)
        const scores = [];
        dataRows.forEach(row => {
          const id = row[0];
          const name = row[1];
          const score = parseInt(row[2], 10);

          if (name && !isNaN(score)) {
            scores.push({ id, name, score });
          }
        });

        // スコア降順ソート
        scores.sort((a, b) => b.score - a.score);

        const rankingContainer = document.getElementById('ranking-container');
        rankingContainer.innerHTML = '';
        scores.forEach((item, index) => {
          const card = document.createElement('div');
          let rankBadge = `第 ${index + 1} 位`;
          let borderStyle = 'border-slate-200 bg-white';
          let badgeBg = 'bg-slate-100 text-slate-600';

          if (index === 0) {
            borderStyle = 'border-amber-400 bg-amber-50/50 shadow-md ring-2 ring-amber-300';
            badgeBg = 'bg-amber-400 text-white font-extrabold';
            rankBadge = '🥇 第 1 位';
          } else if (index === 1) {
            borderStyle = 'border-slate-300 bg-slate-50 shadow-sm';
            badgeBg = 'bg-slate-300 text-slate-800 font-bold';
            rankBadge = '🥈 第 2 位';
          } else if (index === 2) {
            borderStyle = 'border-amber-700/30 bg-orange-50/30 shadow-sm';
            badgeBg = 'bg-amber-700/80 text-white font-bold';
            rankBadge = '🥉 第 3 位';
          }

          card.className = `border rounded-xl p-3 text-center transition ${borderStyle}`;
          card.innerHTML = `
            <div class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeBg} mb-1">
              ${rankBadge}
            </div>
            <div class="text-xl font-black text-slate-800">${item.name}</div>
            <div class="text-lg font-bold text-indigo-900">${item.score} <span class="text-xs font-normal">pt</span></div>
          `;
          rankingContainer.appendChild(card);
        });

        // 3. 競技プログラム (F列, G列)
        const programContainer = document.getElementById('program-container');
        programContainer.innerHTML = '';

        dataRows.forEach(row => {
          const programName = row[5];
          const status = row[6];

          if (programName) {
            const li = document.createElement('li');
            
            if (status === '終了') {
              li.className = 'flex justify-between items-center bg-slate-100 border border-slate-200 text-slate-400 px-4 py-3 rounded-xl line-through';
              li.innerHTML = `
                <span class="font-medium">${programName}</span>
                <span class="no-underline inline-block bg-slate-200 text-slate-500 text-xs px-2.5 py-1 rounded-md font-bold">終了</span>
              `;
            } else if (status === '進行中') {
              li.className = 'flex justify-between items-center bg-red-50 border-2 border-red-500 text-slate-900 px-4 py-3 rounded-xl shadow-md font-bold';
              li.innerHTML = `
                <span class="text-base text-red-950">${programName}</span>
                <span class="inline-flex items-center space-x-1 bg-red-600 text-white text-xs px-2.5 py-1 rounded-md font-bold animate-live shadow">
                  <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                  <span>進行中</span>
                </span>
              `;
            } else {
              li.className = 'flex justify-between items-center bg-white border border-slate-200 text-slate-700 px-4 py-3 rounded-xl shadow-sm';
              li.innerHTML = `
                <span class="font-medium">${programName}</span>
                <span class="text-xs text-slate-400">未開始</span>
              `;
            }

            programContainer.appendChild(li);
          }
        });

        // 最終更新時刻の表示更新
        const now = new Date();
        const timeString = now.toTimeString().split(' ')[0];
        document.getElementById('last-updated-text').textContent = `最終更新: ${timeString}`;

      } catch (error) {
        console.error('データ取得失敗:', error);
      } finally {
        if (isManual) {
          setTimeout(() => {
            refreshBtn.disabled = false;
            refreshIcon.classList.remove('animate-spin');
          }, 400);
        }
      }
    }

    // 初回ロード
    fetchData();

    // 15秒ごとの自動更新
    setInterval(() => fetchData(false), 15000);
  </script>
</body>
</html>
